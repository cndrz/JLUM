<header class="page-header">
    <div class="container">
        <span id="event-detail-badge" class="event-badge event-badge-news" style="display: inline-block; margin-bottom: 1rem;">Category</span>
        <h1 id="event-detail-title">Event Title</h1>
        <p id="event-detail-date" style="opacity: 0.9;">Date Details</p>
    </div>
</header>

<main class="course-grid page-main">
    <div class="course-main-content">
        <div id="event-detail-body" class="event-body-content">
            <!-- Event full description text dynamically injected here -->
        </div>
        <div style="margin-top: 3rem; border-top: 1px solid var(--border-color); padding-top: 2rem;">
            <a href="events.html" class="btn btn-secondary" style="font-size: 0.95rem;">← Back to Events & Updates</a>
        </div>
    </div>

    <div class="course-sidebar">
        <div class="benefits-box" style="margin-top: 0;">
            <h3>Event Information</h3>
            <ul class="benefits-list" style="margin-bottom: 2rem;">
                <li style="color: white;"><strong>Category:</strong> <span id="event-info-type" style="color: white; font-weight: 600;">News</span></li>
                <li style="color: white;"><strong>Scheduled:</strong> <span id="event-info-date" style="color: white; font-weight: 600;">Date details</span></li>
                <li style="color: white;"><strong>Status:</strong> Active / Ongoing</li>
            </ul>
            <a href="contact.html" class="btn btn-primary" style="width: 100%; text-align: center; display: block; background: var(--accent-green); color: white;">Inquire / Register Now</a>
        </div>
    </div>
</main>
